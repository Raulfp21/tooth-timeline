*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

<style id="controlled-course-css">
/* Controlled teaching mode */
#coursePanel{
  position:absolute;top:58px;left:10px;z-index:7;width:min(390px,calc(100vw - 20px));
  max-height:calc(100vh - 75px);overflow:auto;
  background:rgba(13,17,23,.96);color:#e6edf3;border:1px solid #30363d;
  border-radius:16px;padding:12px;box-shadow:0 12px 35px rgba(0,0,0,.35);
}
#coursePanel h2{margin:0 0 3px;font-size:18px;color:#fff}
#coursePanel .sub{font-size:11px;color:#aab4c0;margin-bottom:10px}
.course-progress{height:7px;background:#30363d;border-radius:10px;overflow:hidden;margin:7px 0 12px}
.course-progress>i{display:block;height:100%;background:#58a6ff;width:0;transition:width .25s}
.course-item{
  display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;
  width:100%;text-align:left;border:1px solid #30363d;background:#161b22;

<script>
/* Controlled course hub — works with course-guard.js when present.
   Static-site limitation: this is a learning/integrity indicator, not secure anti-cheating software. */
(function(){
  const modules = [
    ["Age assessment","Methods and principles","learn.html"],
    ["FDI numbering","Permanent and primary numbering","fdinumbering.html"],
    ["Tooth development & eruption","Development, dentition and dental age","index.html"],
    ["3D tooth identification","Explore the tooth model","tooth3d.html"],
    ["Tooth labelling","Identify anatomical structures","label3d.html"],
    ["Gustafson overview","APSRTC and method","gustafson.html"],
    ["Attrition","Gustafson criterion A","attrition.html"],
    ["Periodontosis","Gustafson criterion P","periodontosis.html"],
    ["Secondary dentin","Gustafson criterion S","secondary.html"],
    ["Root resorption","Gustafson criterion R","resorption.html"],
    ["Root transparency","Gustafson criterion T","transparency.html"],
    ["Cementum apposition","Gustafson criterion C","cementum.html"],
    ["Viva & examination","Revision and assessment","viva.html"]
  ];
  const key="foCourseProgressV2";
  const facultyKey="foFacultyModeV2";
  const read=()=>{try{return JSON.parse(localStorage.getItem(key)||"[]")}catch(e){return[]}};
  const save=a=>{try{localStorage.setItem(key,JSON.stringify(a))}catch(e){}};
  const isFaculty=()=>localStorage.getItem(facultyKey)==="1";
  const list=document.getElementById("courseList");
  const bar=document.getElementById("courseProgressBar");
  const ptxt=document.getElementById("courseProgressText");
  function render(){
    const done=read(), faculty=isFaculty();
    if(!list)return;
    list.innerHTML="";
    modules.forEach((m,i)=>{
      const unlocked=faculty || i===0 || done.indexOf(i-1)>=0;
      const complete=done.indexOf(i)>=0;
      const b=document.createElement("button");
      b.className="course-item "+(complete?"done ":"")+(unlocked&&!complete?"active ":"")+(unlocked?"":"locked");
      b.innerHTML='<span class="num">'+String(i+1).padStart(2,"0")+'</span>'+
        '<span><div class="name">'+m[0]+'</div><div class="desc">'+m[1]+'</div></span>'+
        '<span class="state">'+(complete?"✓":unlocked?"›":"🔒")+'</span>';
      b.onclick=()=>{
        if(!unlocked){
          if(window.CourseIntegrity) CourseIntegrity.log("locked_attempt",{module:i+1,name:m[0]});
          alert("This module is locked. Complete the previous module first.");
          return;
        }
        if(window.CourseIntegrity) CourseIntegrity.log("module_open",{module:i+1,name:m[0]});
        location.href=m[2];
      };
      list.appendChild(b);
    });
    const pct=Math.round(done.length/modules.length*100);
    bar.style.width=pct+"%";
    ptxt.textContent=done.length+" of "+modules.length+" modules completed · "+pct+"%";
  }
  window.FOCourse={modules,read,save,render,isFaculty,key,facultyKey};
  document.getElementById("courseFaculty").onclick=()=>{
    const now=isFaculty();
    if(now){
      localStorage.removeItem(facultyKey);
      alert("Student mode restored.");
    }else{
      const code=prompt("Faculty lecture override code (local device only):");
      /* Deliberately not a security credential. Default lecture code can be changed
         in this HTML before deployment. */
      if(code==="LECTURE"){
        localStorage.setItem(facultyKey,"1");
        alert("Faculty mode enabled on this device.");
      }else if(code!==null) alert("Incorrect code.");
    }
    render();
  };
  render();
})();
</script>

function box(w, h, d, mat, x=0, y=0, z=0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  return m;
}
function cyl(rt, rb, h, mat, x=0, y=0, z=0, seg=16) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z);
  return m;
}
function shadowDisc(r, x, z) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(r, 20), M.shadow);
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, 0.02, z);
  return m;
}

const interactives = [];

function labelSprite(text) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 140;
  const ctx = c.getContext('2d');
  const r = 60;
  ctx.fillStyle = 'rgba(210,168,255,0.95)';
  ctx.beginPath();
  ctx.moveTo(r, 10);
  ctx.lineTo(512 - r, 10);
  ctx.quadraticCurveTo(512, 10, 512, 10 + r);
  ctx.lineTo(512, 130 - r);
  ctx.quadraticCurveTo(512, 130, 512 - r, 130);
  ctx.lineTo(r, 130);
  ctx.quadraticCurveTo(0, 130, 0, 130 - r);
  ctx.lineTo(0, 10 + r);
  ctx.quadraticCurveTo(0, 10, r, 10);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#1a1410';
  ctx.font = 'bold 58px -apple-system,sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 256, 74);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false, depthWrite: false
  }));
  spr.scale.set(1.5, 0.41, 1);
  spr.renderOrder = 999;
  return spr;
}

function register(group, url, label) {
  const bb = new THREE.Box3().setFromObject(group);
  const size = new THREE.Vector3(); bb.getSize(size);
  const center = new THREE.Vector3(); bb.getCenter(center);

  const hit = new THREE.Mesh(
    new THREE.BoxGeometry(Math.max(size.x*1.25, 0.7), Math.max(size.y*1.25, 0.7), Math.max(size.z*1.25, 0.7)),
    new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
  );
  hit.position.copy(center);
  hit.userData.url = url;
  hit.userData.label = label;
  hit.userData.group = group;
  group.add(hit);
  interactives.push(hit);

  const lab = labelSprite(label);
  lab.position.set(center.x, bb.max.y + 0.5, center.z);
  group.add(lab);
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let hovered = null;

function pickAt(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(interactives, false);
  return hits.length > 0 ? hits[0].object : null;
}

function setHovered(hit) {
  if (hovered === hit) return;
  if (hovered && hovered.userData.group) hovered.userData.group.scale.setScalar(1);
  hovered = hit;
  if (hit) {
    document.getElementById('info').textContent = '→ Open ' + hit.userData.label;
    if (hit.userData.group) hit.userData.group.scale.setScalar(1.06);
  } else {
    document.getElementById('info').textContent = 'Drag to rotate · pinch to zoom · tap an object';
  }
}

renderer.domElement.addEventListener('pointerdown', e => {
  const sx = e.clientX, sy = e.clientY;
  const onUp = u => {
    renderer.domElement.removeEventListener('pointerup', onUp);
    if (Math.hypot(u.clientX - sx, u.clientY - sy) < 10) {
      const hit = pickAt(u.clientX, u.clientY);
      if (hit && hit.userData.url) {
        const target = hit.userData.url;
        if (window.CourseGuard && !CourseGuard.canOpen(target)) {
          CourseGuard.log("locked_attempt",{target});
          alert("Follow the teaching sequence. Complete the current module first.");
          return;
        }
        window.location.href = target;
      }
    }
  };
  renderer.domElement.addEventListener('pointerup', onUp);
});

renderer.domElement.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  setHovered(pickAt(e.clientX, e.clientY));
});
renderer.domElement.addEventListener('pointerleave', () => setHovered(null));

function turn(c, g, k) { const d = Math.atan2(Math.sin(g - c), Math.cos(g - c)); return c + d * Math.min(1, k); }
function faceYaw(i) {
  const S = STATIONS[i], y0 = Math.atan2(S.look[0] - S.pos[0], S.look[1] - S.pos[1]);
  const yc = Math.atan2(11 - S.pos[0], 11 - S.pos[1]);
  const d = Math.atan2(Math.sin(yc - y0), Math.cos(yc - y0));
  return y0 + Math.sign(d) * Math.min(Math.abs(d), 0.55);   // stand turned slightly towards the viewer
}
function pathBetween(a, b) {
  const out = [];
  if (b > a) { for (let k = a + 1; k <= b; k++) { STATIONS[k].via.forEach(p => out.push(p)); out.push(STATIONS[k].pos); } }
  else { for (let k = a; k > b; k--) { STATIONS[k].via.slice().reverse().forEach(p => out.push(p)); out.push(STATIONS[k - 1].pos); } }
  return out;
}

function tourTick() {
  const dt = Math.min(clk.getDelta(), 0.05), U = guide.userData;
  const ease = (part, target) => { part.rotation.x += (target - part.rotation.x) * Math.min(1, 10 * dt); };
  if (tourOn) {
    if (mode === 'walk') {
      const p = tPath[tPi], dx = p[0] - guide.position.x, dz = p[1] - guide.position.z, dist = Math.hypot(dx, dz), sl = WALK_SPEED * dt;
      if (dist <= sl) { guide.position.x = p[0]; guide.position.z = p[1]; tPi++; if (tPi >= tPath.length) arrive(); }
      else { guide.position.x += dx / dist * sl; guide.position.z += dz / dist * sl; yawT = Math.atan2(dx, dz); }
      ph += dt * 9;
      ease(U.legL, Math.sin(ph) * 0.6); ease(U.legR, -Math.sin(ph) * 0.6);
      ease(U.armL, -Math.sin(ph) * 0.5); ease(U.armR, Math.sin(ph) * 0.5);
    } else if (mode === 'talk') {
      yawT = faceYaw(curSt);
      ease(U.legL, 0); ease(U.legR, 0); ease(U.armL, 0); ease(U.armR, -1.35);   // right arm points at the object
    }
    guide.rotation.y = turn(guide.rotation.y, yawT, 8 * dt);
  }
  // camera drifts to follow the guide (and returns to the room centre when the tour is closed)
  if (tourOn) fg.set(guide.position.x * 0.55, 0.8, guide.position.z * 0.55); else fg.set(0, 0.8, 0);
  fv.copy(fg).sub(controls.target);
  if (fv.lengthSq() > 1e-6) { fv.multiplyScalar(Math.min(1, 2.2 * dt)); controls.target.add(fv); camera.position.add(fv); }
}

// resume where the student left off (e.g. after opening a 3D page and coming back)
try {
  const sv = JSON.parse(sessionStorage.getItem('clinicTour') || 'null');
  if (sv && sv.on && STATIONS[sv.st]) {
    tourOn = true; guide.visible = true; curSt = sv.st; step = Math.min(sv.step || 0, STATIONS[sv.st].steps.length - 1);
    guide.position.set(STATIONS[curSt].pos[0], 0, STATIONS[curSt].pos[1]);
    guide.rotation.y = faceYaw(curSt); yawT = guide.rotation.y;
    mode = 'talk'; openCard(); showStep();
  }
} catch (e) {}
// ═════════ END GUIDED TOUR ═════════

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.03;
  interactives.forEach(hit => {
    const g = hit.userData.group;
    if (g) {
      g.children.forEach(c => {
        if (c.isSprite) {
          c.material.opacity = 0.85 + Math.sin(t) * 0.12;
        }
      });
    }
  });
  controls.update();
  tourTick();
  renderer.render(scene, camera);
}
animate();
</script>
<script src="course-guard.js"></script>
