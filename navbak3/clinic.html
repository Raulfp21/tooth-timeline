function box(w, h, d, mat, x=0, y=0, z=0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  return m;
}
function cyl(rt, rb, h, mat, x=0, y=0, z=0, seg=16) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z);
  return m;
}
function shadowDisc(r, x, z) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(r, 20), M.shadow);
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, 0.02, z);
  return m;
}

const interactives = [];

function labelSprite(text) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 140;
  const ctx = c.getContext('2d');
  const r = 60;
  ctx.fillStyle = 'rgba(210,168,255,0.95)';
  ctx.beginPath();
  ctx.moveTo(r, 10);
  ctx.lineTo(512 - r, 10);
  ctx.quadraticCurveTo(512, 10, 512, 10 + r);
  ctx.lineTo(512, 130 - r);
  ctx.quadraticCurveTo(512, 130, 512 - r, 130);
  ctx.lineTo(r, 130);
  ctx.quadraticCurveTo(0, 130, 0, 130 - r);
  ctx.lineTo(0, 10 + r);
  ctx.quadraticCurveTo(0, 10, r, 10);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#1a1410';
  ctx.font = 'bold 58px -apple-system,sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 256, 74);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false, depthWrite: false
  }));
  spr.scale.set(1.5, 0.41, 1);
  spr.renderOrder = 999;
  return spr;
}

function register(group, url, label) {
  const bb = new THREE.Box3().setFromObject(group);
  const size = new THREE.Vector3(); bb.getSize(size);
  const center = new THREE.Vector3(); bb.getCenter(center);

  const hit = new THREE.Mesh(
    new THREE.BoxGeometry(Math.max(size.x*1.25, 0.7), Math.max(size.y*1.25, 0.7), Math.max(size.z*1.25, 0.7)),
    new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
  );
  hit.position.copy(center);
  hit.userData.url = url;
  hit.userData.label = label;
  hit.userData.group = group;
  group.add(hit);
  interactives.push(hit);

  const lab = labelSprite(label);
  lab.position.set(center.x, bb.max.y + 0.5, center.z);
  group.add(lab);
}

function makePlant(x, z) {

    leaf.position.set(Math.cos(i * 1.6) * 0.2, 1.0 + i * 0.08, Math.sin(i * 1.6) * 0.2);
    leaf.scale.set(1, 0.55, 0.35);
    leaf.rotation.z = (i - 1.5) * 0.4;
    leaf.rotation.y = i * 0.8;
    p.add(leaf);
  }
  p.position.set(x, 0, z);
  scene.add(p);
  scene.add(shadowDisc(0.5, x, z));
}

// ── Interaction ───────────────────────────────
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let hovered = null;

function pickAt(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(interactives, false);
  return hits.length > 0 ? hits[0].object : null;
}

function setHovered(hit) {
  if (hovered === hit) return;
  if (hovered && hovered.userData.group) hovered.userData.group.scale.setScalar(1);
  hovered = hit;
  if (hit) {
    document.getElementById('info').textContent = '→ Open ' + hit.userData.label;
    if (hit.userData.group) hit.userData.group.scale.setScalar(1.06);
  } else {
    document.getElementById('info').textContent = 'Drag to rotate · pinch to zoom · tap an object';
  }
}

renderer.domElement.addEventListener('pointerdown', e => {
  const sx = e.clientX, sy = e.clientY;
  const onUp = u => {
    renderer.domElement.removeEventListener('pointerup', onUp);
    if (Math.hypot(u.clientX - sx, u.clientY - sy) < 10) {
      const hit = pickAt(u.clientX, u.clientY);
      if (hit && hit.userData.url) window.location.href = hit.userData.url;
    }
  };
  renderer.domElement.addEventListener('pointerup', onUp);
});

renderer.domElement.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  setHovered(pickAt(e.clientX, e.clientY));
});
renderer.domElement.addEventListener('pointerleave', () => setHovered(null));

// ── Resize + loop ─────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.03;
  interactives.forEach(hit => {
    const g = hit.userData.group;
    if (g) {
      g.children.forEach(c => {
        if (c.isSprite) {
          c.material.opacity = 0.85 + Math.sin(t) * 0.12;
        }
      });
    }
  });
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body></html>
